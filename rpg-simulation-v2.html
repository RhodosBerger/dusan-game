<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex Island Protocol: Genie Layer</title>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-green: #00ff41;
            --bg-dark: #050505;
            --panel-bg: rgba(10, 15, 20, 0.85);
        }
        body { margin: 0; overflow: hidden; background: var(--bg-dark); font-family: 'Courier New', monospace; color: white; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* UI Overlay Layers */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .hud-panel { 
            position: absolute; 
            background: var(--panel-bg); 
            border: 1px solid var(--neon-blue); 
            padding: 15px; 
            pointer-events: auto;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }
        
        #stats-panel { top: 20px; left: 20px; width: 250px; }
        #quest-panel { top: 20px; right: 20px; width: 300px; border-color: var(--neon-green); }
        #log-panel { bottom: 20px; left: 20px; width: 400px; height: 150px; overflow-y: auto; font-size: 12px; border-color: var(--neon-pink); }
        
        h2 { margin: 0 0 10px 0; font-size: 16px; text-transform: uppercase; letter-spacing: 2px; color: var(--neon-blue); }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .bar-container { width: 100%; background: #333; height: 8px; margin-top: 2px; }
        .bar-fill { height: 100%; transition: width 0.3s; }
        .hp-fill { background: var(--neon-pink); box-shadow: 0 0 10px var(--neon-pink); }
        .dopamine-fill { background: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }
        
        .quest-item { border-left: 2px solid var(--neon-green); padding-left: 10px; margin-bottom: 10px; }
        .quest-title { font-weight: bold; color: var(--neon-green); }
        .quest-desc { font-size: 11px; opacity: 0.8; }
        
        .log-entry { margin-bottom: 4px; border-bottom: 1px solid #333; padding-bottom: 2px; }
        .log-turn { color: var(--neon-blue); }
        .log-danger { color: var(--neon-pink); }
        .log-success { color: var(--neon-green); }

        /* Crosshair */
        #crosshair {
            position: absolute;
            width: 40px; height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: none;
        }
        #crosshair::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            width: 2px; height: 2px; background: var(--neon-blue);
            transform: translate(-50%, -50%);
        }

        button {
            background: transparent; border: 1px solid var(--neon-blue); color: var(--neon-blue);
            padding: 8px 15px; cursor: pointer; font-family: inherit; text-transform: uppercase;
            transition: all 0.2s; margin-top: 5px; width: 100%;
        }
        button:hover { background: var(--neon-blue); color: black; box-shadow: 0 0 15px var(--neon-blue); }
        
        .damage-text {
            position: absolute; color: var(--neon-pink); font-weight: bold; font-size: 20px;
            pointer-events: none; animation: floatUp 1s forwards; text-shadow: 0 0 5px black;
        }
        @keyframes floatUp { to { transform: translateY(-50px); opacity: 0; } }
    </style>
    <!-- Import Three.js for WebGL Layer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
</head>
<body>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <div id="crosshair"></div>
        
        <div id="stats-panel" class="hud-panel">
            <h2>System Status</h2>
            <div class="stat-row"><span>Integrity (HP)</span><span id="hp-val">100%</span></div>
            <div class="bar-container"><div id="hp-bar" class="bar-fill hp-fill" style="width: 100%"></div></div>
            
            <div class="stat-row" style="margin-top: 15px;"><span>Dopamine Level</span><span id="dop-val">0%</span></div>
            <div class="bar-container"><div id="dop-bar" class="bar-fill dopamine-fill" style="width: 0%"></div></div>
            
            <div class="stat-row" style="margin-top: 15px;"><span>Turn</span><span id="turn-val">1</span></div>
            <div class="stat-row"><span>Range</span><span id="range-val">0m</span></div>
            
            <button onclick="game.triggerOracle()">Analyse Reality</button>
            <button onclick="game.nextTurn()" style="border-color: var(--neon-green); color: var(--neon-green);">End Turn</button>
        </div>

        <div id="quest-panel" class="hud-panel">
            <h2>Active Quests</h2>
            <div id="quest-list">
                <!-- Quests injected here -->
            </div>
        </div>

        <div id="log-panel" class="hud-panel">
            <h2>Battle Log / Oracle Stream</h2>
            <div id="log-content"></div>
        </div>
    </div>

<script>
/**
 * ARCHITECTURE OVERHAUL
 * 1. WorldEngine: Three.js based hex grid with dynamic texture warping.
 * 2. DataManager: Handles NPC stories, Quest generation, and Dopamine state.
 * 3. RenderLoop: Manages the "Peeling" effect and camera movement.
 */

// --- CONFIGURATION ---
const CONFIG = {
    hexSize: 10,
    islandRadius: 8,
    colors: {
        water: 0x050510,
        landBase: 0x1a1a2e,
        landHighlight: 0x00f3ff,
        enemy: 0xff00ff,
        player: 0x00ff41
    }
};

// --- UTILS ---
const SimplexNoise = window.SimplexNoise;
const simplex = new SimplexNoise();

function randomRange(min, max) { return Math.random() * (max - min) + min; }

// --- DATA LAYER (The Brain) ---
class DataManager {
    constructor() {
        this.turn = 1;
        this.dopamine = 0;
        this.hp = 100;
        this.maxHp = 100;
        this.npcs = [];
        this.quests = [];
        this.logs = [];
        this.generateInitialWorld();
    }

    generateInitialWorld() {
        // Generate unique NPC stories based on ruleset
        const archetypes = ['Exiled Knight', 'Glitch Merchant', 'Data Wraith'];
        for(let i=0; i<3; i++) {
            this.npcs.push({
                id: i,
                type: archetypes[i],
                storyState: 'neutral', // neutral, hostile, allied
                memory: [`Spawned at turn 1.`],
                pos: { x: randomRange(-20, 20), y: randomRange(-20, 20) }
            });
        }
        this.spawnQuest();
    }

    spawnQuest() {
        const objectives = ['Secure the Hex Node', 'Eliminate Data Wraith', 'Survive 5 Turns'];
        const q = {
            id: Date.now(),
            title: objectives[Math.floor(Math.random() * objectives.length)],
            desc: `Generated by Quest Operator v${this.turn}. Reward: Dopamine Spike.`,
            completed: false
        };
        this.quests.push(q);
        this.log(`New Quest: ${q.title}`, 'system');
        ui.updateQuests(this.quests);
    }

    addDopamine(amount) {
        this.dopamine = Math.min(100, Math.max(0, this.dopamine + amount));
        ui.updateStats(this.hp, this.dopamine, this.turn);
        
        // Dopamine Feedback Loop
        if(this.dopamine > 90) {
            this.log("CRITICAL DOPAMINE: Reality stabilizing.", "success");
            world.setStability(1.0);
        } else if (this.dopamine < 20) {
            this.log("LOW DOPAMINE: World fragmentation increasing.", "danger");
            world.setStability(0.4);
        }
    }

    takeDamage(amount) {
        this.hp -= amount;
        this.addDopamine(-10); // Pain reduces dopamine
        ui.updateStats(this.hp, this.dopamine, this.turn);
        
        if(this.hp <= 0) {
            this.log("SYSTEM FAILURE. SIMULATION ENDED.", "danger");
            // Game Over logic
        } else {
            // Trigger "Peeling" effect based on HP loss
            const damageRatio = 1 - (this.hp / this.maxHp);
            world.triggerPeeling(damageRatio);
        }
    }

    log(msg, type = 'normal') {
        const entry = { turn: this.turn, msg, type };
        this.logs.unshift(entry);
        ui.addLog(entry);
    }

    nextTurn() {
        this.turn++;
        this.log(`--- Turn ${this.turn} Initiated ---`, 'turn');
        
        // NPC Scripted Actions
        this.npcs.forEach(npc => {
            if(Math.random() > 0.7) {
                this.log(`${npc.type} performs a tactical maneuver.`, 'normal');
                // Could trigger damage or quest progress
            }
        });

        // Random Event
        if(Math.random() > 0.8) {
            this.spawnQuest();
        }

        ui.updateStats(this.hp, this.dopamine, this.turn);
    }
}

// --- WORLD ENGINE (Three.js + Project Genie Style) ---
class WorldEngine {
    constructor() {
        this.container = document.getElementById('canvas-container');
        this.scene = new THREE.Scene();
        this.scene.fog = new THREE.FogExp2(CONFIG.colors.water, 0.03);
        
        this.camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
        this.camera.position.set(0, 30, 20);
        this.camera.lookAt(0, 0, 0);

        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(window.devicePixelRatio);
        this.container.appendChild(this.renderer.domElement);

        this.hexMeshes = [];
        this.islandGroup = new THREE.Group();
        this.scene.add(this.islandGroup);

        this.stability = 1.0; // 1.0 = perfect, 0.0 = chaotic peeling
        this.peelingProgress = 0;

        this.initLights();
        this.generateHexMap();
        this.animate();

        // Mouse interaction for raycasting
        this.raycaster = new THREE.Raycaster();
        this.mouse = new THREE.Vector2();
        window.addEventListener('mousemove', (e) => this.onMouseMove(e));
        window.addEventListener('click', () => this.onClick());
        window.addEventListener('resize', () => this.onResize());
    }

    initLights() {
        const ambient = new THREE.AmbientLight(0x404040, 2);
        this.scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(CONFIG.colors.landHighlight, 0.8);
        dirLight.position.set(10, 20, 10);
        this.scene.add(dirLight);
    }

    createHexTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        
        // Procedural "Project Genie" style texture
        const grad = ctx.createLinearGradient(0,0,256,256);
        grad.addColorStop(0, '#1a1a2e');
        grad.addColorStop(1, '#16213e');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,256,256);
        
        // Grid lines
        ctx.strokeStyle = 'rgba(0, 243, 255, 0.3)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(10, 10); ctx.lineTo(246, 10); ctx.lineTo(246, 246); ctx.lineTo(10, 246); ctx.closePath();
        ctx.stroke();

        // Noise overlay simulation
        for(let i=0; i<500; i++) {
            ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.1})`;
            ctx.fillRect(Math.random()*256, Math.random()*256, 2, 2);
        }

        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        return tex;
    }

    generateHexMap() {
        const geometry = new THREE.CylinderGeometry(CONFIG.hexSize, CONFIG.hexSize, 2, 6);
        const material = new THREE.MeshStandardMaterial({ 
            map: this.createHexTexture(),
            roughness: 0.4,
            metalness: 0.8,
            emissive: CONFIG.colors.landBase,
            emissiveIntensity: 0.2
        });

        // Generate Island Cluster
        for (let q = -CONFIG.islandRadius; q <= CONFIG.islandRadius; q++) {
            let r1 = Math.max(-CONFIG.islandRadius, -q - CONFIG.islandRadius);
            let r2 = Math.min(CONFIG.islandRadius, -q + CONFIG.islandRadius);
            for (let r = r1; r <= r2; r++) {
                // Convert axial to cartesian
                const x = CONFIG.hexSize * Math.sqrt(3) * (q + r/2);
                const z = CONFIG.hexSize * 3/2 * r;
                
                // Add noise for height variation
                const noise = simplex.noise2D(q * 0.1, r * 0.1);
                const y = noise * 2; 

                const hex = new THREE.Mesh(geometry, material.clone());
                hex.position.set(x, y, z);
                hex.userData = { q, r, baseY: y, type: 'land' };
                
                this.islandGroup.add(hex);
                this.hexMeshes.push(hex);
            }
        }
    }

    setStability(val) {
        this.stability = val;
    }

    triggerPeeling(intensity) {
        // "Čím menej HP, tým viac sa ostrovy odliepajú"
        this.peelingProgress = Math.min(1, intensity * 1.5);
        
        this.hexMeshes.forEach(hex => {
            if(Math.random() < this.peelingProgress) {
                // Detach logic: Move away from center or rotate wildly
                const direction = new THREE.Vector3().copy(hex.position).normalize();
                const force = randomRange(0.5, 2.0) * this.peelingProgress;
                
                // Animate via user data target
                hex.userData.targetPos = hex.position.clone().add(direction.multiplyScalar(force));
                hex.userData.targetRot = {
                    x: randomRange(-1, 1),
                    y: randomRange(-1, 1),
                    z: randomRange(-1, 1)
                };
                hex.userData.isPeeling = true;
                
                // Change color to indicate instability
                hex.material.emissive.setHex(CONFIG.colors.enemy);
                hex.material.emissiveIntensity = 0.8;
            }
        });
    }

    onMouseMove(event) {
        this.mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        this.mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        
        const crosshair = document.getElementById('crosshair');
        crosshair.style.display = 'block';
        crosshair.style.left = event.clientX + 'px';
        crosshair.style.top = event.clientY + 'px';

        this.raycaster.setFromCamera(this.mouse, this.camera);
        const intersects = this.raycaster.intersectObjects(this.hexMeshes);
        
        if(intersects.length > 0) {
            const obj = intersects[0].object;
            const dist = this.camera.position.distanceTo(obj.position);
            document.getElementById('range-val').innerText = Math.floor(dist) + 'm';
            
            // Highlight hover
            this.hexMeshes.forEach(h => h.material.emissiveIntensity = h.userData.isPeeling ? 0.8 : 0.2);
            if(!obj.userData.isPeeling) {
                obj.material.emissiveIntensity = 0.6;
                obj.material.emissive.setHex(CONFIG.colors.landHighlight);
            }
        }
    }

    onClick() {
        this.raycaster.setFromCamera(this.mouse, this.camera);
        const intersects = this.raycaster.intersectObjects(this.hexMeshes);
        
        if(intersects.length > 0) {
            const target = intersects[0].object;
            if(target.userData.isPeeling) {
                game.dataManager.log("Target unstable! Cannot interact.", "danger");
                return;
            }
            
            // Simulate Action
            game.dataManager.log(`Action executed on Hex [${target.userData.q}, ${target.userData.r}]`, "success");
            game.dataManager.addDopamine(5);
            
            // Spawn Damage Text
            ui.showDamageText(intersects[0].point, "-10 HP (Simulated Risk)");
            game.dataManager.takeDamage(5); // Risk mechanic
        }
    }

    onResize() {
        this.camera.aspect = window.innerWidth / window.innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(window.innerWidth, window.innerHeight);
    }

    animate() {
        requestAnimationFrame(() => this.animate());
        
        // Gentle floating animation for stable islands
        const time = Date.now() * 0.001;
        this.hexMeshes.forEach(hex => {
            if(!hex.userData.isPeeling) {
                hex.position.y = hex.userData.baseY + Math.sin(time + hex.userData.q) * 0.2;
                hex.rotation.y += 0.002;
            } else {
                // Peeling animation logic
                if(hex.userData.targetPos) {
                    hex.position.lerp(hex.userData.targetPos, 0.02);
                    hex.rotation.x += hex.userData.targetRot.x * 0.05;
                    hex.rotation.y += hex.userData.targetRot.y * 0.05;
                    hex.rotation.z += hex.userData.targetRot.z * 0.05;
                    
                    // Fade out if too far
                    if(hex.position.distanceTo(new THREE.Vector3(0,0,0)) > 50) {
                        hex.scale.multiplyScalar(0.95);
                    }
                }
            }
        });

        // Camera drift based on stability
        if(this.stability < 1.0) {
            this.camera.position.x += Math.sin(time) * 0.05 * (1-this.stability);
            this.camera.position.y += Math.cos(time * 0.5) * 0.05 * (1-this.stability);
        }

        this.renderer.render(this.scene, this.camera);
    }
}

// --- UI MANAGER ---
class UIManager {
    updateStats(hp, dop, turn) {
        document.getElementById('hp-val').innerText = `${Math.floor(hp)}%`;
        document.getElementById('hp-bar').style.width = `${Math.max(0, hp)}%`;
        document.getElementById('dop-val').innerText = `${Math.floor(dop)}%`;
        document.getElementById('dop-bar').style.width = `${dop}%`;
        document.getElementById('turn-val').innerText = turn;
    }

    updateQuests(quests) {
        const list = document.getElementById('quest-list');
        list.innerHTML = '';
        quests.forEach(q => {
            const div = document.createElement('div');
            div.className = 'quest-item';
            div.innerHTML = `<div class="quest-title">${q.title}</div><div class="quest-desc">${q.desc}</div>`;
            list.appendChild(div);
        });
    }

    addLog(entry) {
        const container = document.getElementById('log-content');
        const div = document.createElement('div');
        div.className = `log-entry log-${entry.type}`;
        div.innerText = `[T${entry.turn}] ${entry.msg}`;
        container.prepend(div);
        if(container.children.length > 20) container.lastChild.remove();
    }

    showDamageText(point, text) {
        // Project 3D point to 2D screen
        const vec = point.clone();
        vec.project(game.world.camera);
        const x = (vec.x * .5 + .5) * window.innerWidth;
        const y = (-(vec.y * .5) + .5) * window.innerHeight;

        const el = document.createElement('div');
        el.className = 'damage-text';
        el.innerText = text;
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1000);
    }
}

// --- GAME CONTROLLER ---
class Game {
    constructor() {
        this.dataManager = new DataManager();
        this.world = new WorldEngine();
        this.ui = new UIManager();
        
        // Expose for global access (buttons)
        window.game = this;
        window.ui = this.ui;
    }

    triggerOracle() {
        // Simulate LLM Analysis
        const prompts = [
            "Analysing combat patterns... Enemy weakness detected in Sector 7.",
            "Dopamine levels critical. Suggest aggressive expansion to stabilize reality.",
            "Quest Operator suggests rerouting path through unstable hexes for high reward."
        ];
        const response = prompts[Math.floor(Math.random() * prompts.length)];
        this.dataManager.log(`ORACLE: ${response}`, 'success');
        this.dataManager.addDopamine(10);
    }

    nextTurn() {
        this.dataManager.nextTurn();
    }
}

// Start Game
const game = new Game();

</script>
</body>
</html>
