environments:
  dev:
    project: "tactical-airena"
    region: "us-central1"
    composer_environment: "tactical-composer"
    artifact_storage:
      bucket: "tactical-airena-pipelines"
      path_prefix: pipelines
    variables:
      service_account: "tactical-sa@tactical-airena.iam.gserviceaccount.com"
      network_uri: projects/tactical-airena/global/networks/default
    pipelines:
      - source: orchestration_pipeline.yaml
