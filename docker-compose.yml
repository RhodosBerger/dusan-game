version: '3.8'

services:
  go-core:
    build:
      context: .
      dockerfile: packages/go-core/Dockerfile
    ports:
      - "8081:8081"
    restart: always

  node-server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "3001:3001"
    restart: always

  client-router:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - go-core
      - node-server
    environment:
      - GO_CORE_URL=http://go-core:8081
      - NODE_SERVER_URL=http://node-server:3001
    restart: always
