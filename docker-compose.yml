version: '3.8'

services:
  go-core:
    build:
      context: .
      dockerfile: packages/go-core/Dockerfile
    ports:
      - "8081:8081"
    restart: always

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    restart: always

  node-server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - GO_CORE_URL=http://go-core:8081
      - CLICKHOUSE_URL=http://clickhouse:8123
    depends_on:
      - clickhouse
    restart: always

  client-router:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - go-core
      - node-server
      - clickhouse
    environment:
      - GO_CORE_URL=http://go-core:8081
      - NODE_SERVER_URL=http://node-server:3001
      - CLICKHOUSE_URL=http://clickhouse:8123
    restart: always

volumes:
  clickhouse-data:
